<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Hybrid Wallet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>

<nav>
    <h3>Hybrid Wallet</h3>
    <div>
        <a href="/transfer">Transfer</a>
        <a href="/history">History</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="balance-section">
        <div class="balance-card online">
            <h3>Online Balance</h3>
            <p>Rs. {{ online }}</p>
        </div>

        <div class="balance-card offline">
            <h3>Offline Balance</h3>
            <p>Rs. {{ offline }}</p>
        </div>
    </div>

    <div class="actions">

        <h3>Deposit</h3>
        <form method="POST" action="/deposit">
            <input type="number" step="0.01" name="amount" placeholder="Amount" required>
            <button type="submit">Deposit</button>
        </form>

        <h3>Withdraw</h3>
        <form method="POST" action="/withdraw">
            <input type="number" step="0.01" name="amount" placeholder="Amount" required>
            <button type="submit">Withdraw</button>
        </form>

        <h3>Move Online → Offline</h3>
        <form method="POST" action="/move_offline">
            <input type="number" step="0.01" name="amount" placeholder="Amount" required>
            <button type="submit">Move to Offline</button>
        </form>

        <h3>Offline Transfer</h3>
        <form method="POST" action="/offline_transfer">
            <input type="text" name="receiver" placeholder="Receiver Username" required>
            <input type="number" step="0.01" name="amount" placeholder="Amount" required>
            <button type="submit">Send Offline</button>
        </form>

        <h3>Sync Offline Transactions</h3>
        <a href="/sync" class="sync-btn">Sync Now</a>

    </div>
</div>

</body>
</html>
